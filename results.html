<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results | Indore Fitness</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html{scroll-behavior:smooth;}

/* SAME THEME */
:root{
  --red:#d6452f;
  --black:#0f0f0f;
  --gray:#6b6b6b;
  --light:#f3efe8;
  --lighter:#fbf8f2;
  --card:#ffffff;
  --border:#e8e2d9;
}

body{
  background:var(--lighter);
  color:var(--black);
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  padding:18px 70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--lighter);
  border-bottom:1px solid var(--border);
  z-index:1000;
}

/* NAV — SAME AS HOME PAGE */
nav{
  position:fixed;
  top:0;
  width:100%;
  padding:18px 70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--lighter);
  border-bottom:1px solid var(--border);
  z-index:1000;
  transition:.35s;
}

nav.scrolled{
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  backdrop-filter:blur(6px);
}

nav h1{
  font-size:26px;
  font-weight:800;
  color:var(--red);
}

nav ul{
  list-style:none;
  display:flex;
  gap:28px;
}

nav ul li a{
  text-decoration:none;
  color:#111;
  font-weight:500;
}

nav ul li a:hover{
  color:var(--red);
}


/* HEADER */
.header{
  padding:160px 20px 50px;
  text-align:center;
}

.header h2{
  font-size:44px;
  font-weight:800;
}

.header span{
  color:var(--red);
}

.header p{
  color:var(--gray);
  margin-top:12px;
}

/* GALLERY */
.gallery{
  padding:40px 80px 120px;
}

.gallery-grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
}

/* IMAGE CARD */
.img-card{
  position:relative;
  border-radius:22px;
  overflow:hidden;
  background:#000;
  box-shadow:0 18px 40px rgba(0,0,0,.12);
  transform:translateY(40px);
  opacity:0;
  transition:.6s ease;
}

.img-card.active{
  transform:none;
  opacity:1;
}

.img-card img{
  width:100%;
  height:420px;
  object-fit:cover;
  display:block;
  transition:.5s ease;
}

/* HOVER EFFECT */
.img-card:hover img{
  transform:scale(1.08);
  filter:contrast(1.05) saturate(1.05);
}

.img-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.25), transparent);
  opacity:.7;
}

/* FOOTER */
footer{
  background:#111;
  color:#ddd;
  text-align:center;
  padding:26px;
}

/* MOBILE */
@media(max-width:900px){
/* MOBILE NAV — same as home */
nav{
  flex-direction:column;
  gap:12px;
  padding:16px 20px;
}

nav ul{
  width:100%;
  justify-content:space-between;
  gap:0;
}

nav ul li{
  flex:1;
  text-align:center;
}

  .gallery{
    padding:40px 30px 100px;
  }

  .gallery-grid{
  grid-template-columns:1fr 1fr;
}


  .img-card img{
    height:220px;
  }
  .gallery-grid{
  gap:16px;
}

}
/* ===== FLOATING CONTACT BAR ===== */
.float-bar{
  position:fixed;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:14px;
  z-index:2000;
}

.float-btn{
  width:56px;
  height:56px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--red);
  box-shadow:0 10px 25px rgba(0,0,0,.18);
  transition:.25s;
}

.float-btn:hover{
  transform:scale(1.12);
}

.float-btn svg{
  width:26px;
  height:26px;
  fill:#fff;
}

/* smaller on mobile */
@media(max-width:900px){
  .float-btn{
    width:48px;
    height:48px;
  }

  .float-btn svg{
    width:22px;
    height:22px;
  }
}

</style>
</head>

<body>

<nav>
  <h1>Indore Fitness</h1>

  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>


<!-- HEADER -->
<section class="header">
  <h2>Client <span>Results</span></h2>
  <p>Real women. Real transformations. Real progress.</p>
</section>

<!-- GALLERY -->
<section class="gallery">

  <div class="gallery-grid">

    <!-- IMAGE -->
    <div class="img-card"><img src="r1.jpg"></div>
    <div class="img-card"><img src="r2.jpg"></div>
    <div class="img-card"><img src="r3.jpg"></div>

    <div class="img-card"><img src="r4.jpg"></div>
    <div class="img-card"><img src="r5.jpg"></div>
    <div class="img-card"><img src="r6.jpg"></div>

  </div>

</section>

<footer>
  © 2026 Indore Fitness • Women Only Online Fitness Studio
</footer>

<script>
/* reveal animation */
const cards = document.querySelectorAll(".img-card");

function reveal(){
  cards.forEach(c=>{
    if(c.getBoundingClientRect().top < window.innerHeight - 80){
      c.classList.add("active");
    }
  });
}

window.addEventListener("scroll", reveal);
reveal();
</script>
<script>
document.addEventListener("scroll",()=>{
  if(window.scrollY > 40){
    document.querySelector("nav").classList.add("scrolled");
  } else {
    document.querySelector("nav").classList.remove("scrolled");
  }
});
</script>

<!-- ===== FLOATING CONTACT BUTTONS ===== -->
<div class="float-bar">

  <!-- CALL -->
  <a class="float-btn" href="tel:+911234567890">
    <svg viewBox="0 0 24 24">
      <path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25c1.1.3 2.3.45 3.6.45a1 1 0 011 1V21a1 1 0 01-1 1C11 22 2 13 2 2a1 1 0 011-1h3.6a1 1 0 011 1c0 1.3.15 2.5.45 3.6a1 1 0 01-.25 1z"/>
    </svg>
  </a>

  <!-- INSTAGRAM -->
  <a class="float-btn" href="https://instagram.com/yourprofile" target="_blank">
    <svg viewBox="0 0 24 24">
      <path d="M7 2C4 2 2 4 2 7v10c0 3 2 5 5 5h10c3 0 5-2 5-5V7c0-3-2-5-5-5H7zm5 5a5 5 0 110 10 5 5 0 010-10zm6.5-.8a1.3 1.3 0 110 2.6 1.3 1.3 0 010-2.6z"/>
    </svg>
  </a>

  <!-- FACEBOOK -->
  <a class="float-btn" href="https://facebook.com/yourpage" target="_blank">
    <svg viewBox="0 0 24 24">
      <path d="M13 22v-8h3l1-4h-4V7c0-1.1.3-2 2-2h2V1.5S15.5 1 14 1c-3 0-5 2-5 5v3H6v4h3v8z"/>
    </svg>
  </a>

</div>


</body>

<script>
document.addEventListener("scroll",()=>{
  if(window.scrollY > 40){
    document.querySelector("nav").classList.add("scrolled");
  } else {
    document.querySelector("nav").classList.remove("scrolled");
  }
});
</script>

</html>
