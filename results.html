<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results | Indore Fitness</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html{scroll-behavior:smooth;}

/* SAME THEME */
:root{
  --red:#d6452f;
  --black:#0f0f0f;
  --gray:#6b6b6b;
  --light:#f3efe8;
  --lighter:#fbf8f2;
  --card:#ffffff;
  --border:#e8e2d9;
}

body{
  background:var(--lighter);
  color:var(--black);
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  padding:18px 70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--lighter);
  border-bottom:1px solid var(--border);
  z-index:1000;
}

nav h1{
  font-size:26px;
  font-weight:800;
  color:var(--red);
}

nav ul{
  list-style:none;
  display:flex;
  gap:28px;
}

nav a{
  text-decoration:none;
  color:#111;
  font-weight:500;
}

/* HEADER */
.header{
  padding:160px 20px 50px;
  text-align:center;
}

.header h2{
  font-size:44px;
  font-weight:800;
}

.header span{
  color:var(--red);
}

.header p{
  color:var(--gray);
  margin-top:12px;
}

/* GALLERY */
.gallery{
  padding:40px 80px 120px;
}

.gallery-grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
}

/* IMAGE CARD */
.img-card{
  position:relative;
  border-radius:22px;
  overflow:hidden;
  background:#000;
  box-shadow:0 18px 40px rgba(0,0,0,.12);
  transform:translateY(40px);
  opacity:0;
  transition:.6s ease;
}

.img-card.active{
  transform:none;
  opacity:1;
}

.img-card img{
  width:100%;
  height:420px;
  object-fit:cover;
  display:block;
  transition:.5s ease;
}

/* HOVER EFFECT */
.img-card:hover img{
  transform:scale(1.08);
  filter:contrast(1.05) saturate(1.05);
}

.img-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.25), transparent);
  opacity:.7;
}

/* FOOTER */
footer{
  background:#111;
  color:#ddd;
  text-align:center;
  padding:26px;
}

/* MOBILE */
@media(max-width:900px){
  .gallery{
    padding:40px 30px 100px;
  }

  .gallery-grid{
    grid-template-columns:1fr;
  }

  .img-card img{
    height:320px;
  }
}
</style>
</head>

<body>

<nav>
  <h1>Indore Fitness</h1>

  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>


<!-- HEADER -->
<section class="header">
  <h2>Client <span>Results</span></h2>
  <p>Real women. Real transformations. Real progress.</p>
</section>

<!-- GALLERY -->
<section class="gallery">

  <div class="gallery-grid">

    <!-- IMAGE -->
    <div class="img-card"><img src="r1.jpg"></div>
    <div class="img-card"><img src="r2.jpg"></div>
    <div class="img-card"><img src="r3.jpg"></div>

    <div class="img-card"><img src="r4.jpg"></div>
    <div class="img-card"><img src="r5.jpg"></div>
    <div class="img-card"><img src="r6.jpg"></div>

  </div>

</section>

<footer>
  © 2026 Indore Fitness • Women Only Online Fitness Studio
</footer>

<script>
/* reveal animation */
const cards = document.querySelectorAll(".img-card");

function reveal(){
  cards.forEach(c=>{
    if(c.getBoundingClientRect().top < window.innerHeight - 80){
      c.classList.add("active");
    }
  });
}

window.addEventListener("scroll", reveal);
reveal();
</script>

</body>
</html>
