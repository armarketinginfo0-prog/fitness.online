<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformations | Indoor Fitness</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

<style>
/* ══════════════════ ROOT & RESET ══════════════════ */
*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; overflow-x:hidden; }
body{ background:#faf6f0; color:#0a0908; font-family:'DM Sans',sans-serif; overflow-x:hidden; }
:root{
  --red:#e03d22; --gold:#f5a623; --cream:#faf6f0; --dark:#0d0b0a;
  --white:#fff; --gray:#7a7470; --border:rgba(224,61,34,0.1);
  --fd:'Syne',sans-serif;
}

/* ══════════════════ NAV ══════════════════ */
nav{
  position:fixed; top:0; width:100%; padding:20px 72px;
  display:flex; justify-content:space-between; align-items:center;
  z-index:1000; background:rgba(250,246,240,0.92); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.nav-logo{ font-family:var(--fd); font-size:22px; font-weight:800; color:var(--red); text-decoration:none; }
nav ul{ list-style:none; display:flex; gap:36px; }
nav ul li a{ text-decoration:none; color:var(--black); font-weight:500; font-size:14px; }

/* ══════════════════ HEADER & TABS ══════════════════ */
.header{ padding:160px 20px 40px; text-align:center; }
.header h2{ font-family:var(--fd); font-size:52px; font-weight:800; letter-spacing:-2.5px; }
.header h2 span{ color: var(--red); }

.media-toggle { display: flex; justify-content: center; gap: 12px; margin: 30px 0 30px; }
.tab-btn {
  padding: 14px 34px; border: 1.5px solid var(--red); background: transparent;
  color: var(--red); font-family: var(--fd); font-weight: 700; cursor: pointer;
  border-radius: 50px; text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px;
}
.tab-btn.active { background: var(--red); color: #fff; }

/* ══════════════════ GALLERY ══════════════════ */
.gallery-container { max-width: 1100px; margin: auto; padding: 0 20px 60px; }
.media-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.media-grid.hidden { display: none; }

.media-card { border-radius: 2px; overflow: hidden; background: #000; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; }
.media-card img, .media-card video { width: 100%; height: 480px; object-fit: cover; display: block; }

/* ══════════════════ BUTTONS ══════════════════ */
.btn-center { display: flex; justify-content: center; margin-bottom: 80px; }
.btn {
  display: inline-flex; align-items: center; gap: 10px; padding: 15px 40px;
  background: var(--red); color: #fff; border-radius: 4px; text-decoration: none;
  font-size: 14px; font-weight: 600; text-transform: uppercase; border: 1px solid var(--red);
  transition: all .35s ease;
}
.btn:hover { background: #fff; color: var(--red); }

/* ══════════════════ CTA SECTION ══════════════════ */
#final{ background:var(--dark); padding:140px 80px; text-align:center; position:relative; overflow:hidden; }
#final h2{ font-family:var(--fd); font-size:52px; color:#fff; margin-bottom: 20px; }
#final p{ color:rgba(255,255,255,.5); max-width:480px; margin:0 auto 48px; line-height: 1.6; }
.cta-buttons{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }

/* GRAIN OVERLAY */
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:9999;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  opacity:.4;
}

@media(max-width:900px){
  nav{ padding:12px 16px; flex-direction:column; }
  nav ul{ width:100%; justify-content:space-around; }
  .media-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .media-card img, .media-card video { height: 280px; }
  #final { padding: 80px 20px; }
  #final h2 { font-size: 32px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Indoor Fitness</a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>

<section class="header">
  <h2>Client <span>Success</span></h2>
</section>

<div class="gallery-container">
  <div id="photos-grid" class="media-grid"></div>

</div>

<div class="btn-center">
  <a href="https://share.google/2JT9GlAFPYUVRmhnc" target="_blank" class="btn">
    <span>More Reviews</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>
</div>

<section id="final">
  <h2 class="section-heading">Start your fitness<br>journey today</h2>
  <p>Message us directly — we reply fast and we're ready to help you transform.</p>
  <div class="cta-buttons">
    <a href="https://wa.me/919500644455" class="btn">
      <span>Chat on WhatsApp</span>
    </a>
    <a href="https://www.instagram.com/kavitha_onlinefitness" class="btn" style="background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); border:none;">
      <span>Message on Instagram</span>
    </a>
  </div>
</section>

<footer>
  <p style="text-align:center; padding: 40px; color: var(--gray); font-size: 13px;">
    © 2026 Indoor Fitness · Women Only Online Fitness Studio · Chennai, India
  </p>
</footer>

<script>
// 1. GENERATE PHOTOS (ba1 to ba17)
const photosGrid = document.getElementById('photos-grid');
const TOTAL_PHOTOS = 17;

for (let i = 1; i <= TOTAL_PHOTOS; i++) {
  photosGrid.innerHTML += `
    <div class="media-card tilt">
      <img src="ba${i}.jpg" loading="lazy" alt="Transformation ${i}">
    </div>`;
}

// 2. TILT EFFECT (For high-end feel on desktop)
document.querySelectorAll('.tilt').forEach(el => {
  el.addEventListener('mousemove', e => {
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = `perspective(800px) rotateY(${x * 12}deg) rotateX(${-y * 8}deg) scale(1.02)`;
  });
  el.addEventListener('mouseleave', () => { 
    el.style.transform = ''; 
  });
});

// 3. NAV SCROLL EFFECT
window.addEventListener('scroll', () => {
  document.querySelector('nav').classList.toggle('scrolled', window.scrollY > 50);
}, { passive: true });
</script>

</body>
</html>
